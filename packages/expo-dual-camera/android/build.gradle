plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dualcamera'
def packageJson = new groovy.json.JsonSlurper().parseText(
  new File(rootDir, '../package.json').text
)
version = packageJson.version

android {
  namespace "expo.modules.dualcamera"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.camera:camera-core:1.3.4"
  implementation "androidx.camera:camera-camera2:1.3.4"
  implementation "androidx.camera:camera-lifecycle:1.3.4"
  implementation "androidx.camera:camera-view:1.3.4"
  implementation "androidx.camera:camera-concurrent:1.3.4"
}
